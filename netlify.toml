[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# nourab.dev and nourab.netlify.app are the same Netlify project, so this is not
# a duplicate deploy — but both hostnames answer. Send the subdomain to the
# custom domain so there is one address in circulation.
[[redirects]]
  from = "https://nourab.netlify.app/*"
  to = "https://nourab.dev/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # 'unsafe-inline' in script-src: Next inlines its RSC bootstrap payload in the HTML.
    # Tightening this requires a per-request nonce from middleware, which opts pages out of static rendering.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cdn.sanity.io; connect-src 'self' https://*.sanity.io; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"
